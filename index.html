<!DOCTYPE html>
<html lang="es" data-theme="dark" style="color-scheme: dark;"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ORBIA 1221 — Catálogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&amp;family=Montserrat:wght@300;400;500&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0c08;--bg2:#12140d;--fg:#e9e6d6;--mut:#8d8f78;--ac:#8f9a6c;--ln:rgba(233,230,214,.16);--hd:'Syncopate','Arial Black',sans-serif;--bd:'Montserrat',system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:300 15px/1.6 var(--bd);overflow-x:hidden}
img{max-width:100%;display:block}button{font:inherit;color:inherit;cursor:pointer}
.sec{padding:84px 22px;max-width:1180px;margin:0 auto}
h2{font:400 clamp(22px,4.5vw,38px)/1.3 var(--hd);letter-spacing:.12em;margin:14px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:22px;margin-top:38px}
.card{background:var(--bg2);border:1px solid var(--ln);display:flex;flex-direction:column;position:relative}
.card .im{aspect-ratio:4/5;background:#0e100a;overflow:hidden}.card .im img{width:100%;height:100%;object-fit:cover}
.card .in{padding:16px 16px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{margin:0;font:400 12px var(--hd);letter-spacing:.14em}.card p{margin:0;color:var(--mut);font-size:13px;flex:1;white-space:pre-line}
.price{font:500 15px var(--bd);letter-spacing:.06em;margin-top:6px}
.ord{margin-top:10px;background:var(--fg);color:var(--bg);border:0;padding:12px;font:700 10px var(--hd);letter-spacing:.3em}
.empty{border:1px dashed var(--ln);padding:50px 20px;text-align:center;color:var(--mut);margin-top:38px}
.adm{position:absolute;top:8px;right:8px;display:flex;gap:6px}.adm button,.btn{background:rgba(11,12,8,.85);border:1px solid var(--ln);padding:6px 10px;font-size:12px}
footer{border-top:1px solid var(--ln);padding:40px 22px 120px;text-align:center;color:var(--mut);font:400 10px var(--hd);letter-spacing:.3em}
footer img{width:110px;margin:0 auto 18px}footer button{background:none;border:0;color:var(--mut);font:inherit;letter-spacing:inherit;margin-top:18px;opacity:.6}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#15170f;border-top:1px solid var(--ln);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px))}
.bar .btn{background:none}.bar .go{background:var(--ac);color:#0b0c08;border-color:var(--ac);font-weight:500}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#13150e;border:1px solid var(--ln);width:100%;max-width:480px;max-height:92svh;overflow:auto;padding:24px 22px calc(24px + env(safe-area-inset-bottom,0px))}
@media(min-width:600px){.ov{align-items:center}}
.sheet h4{font:400 13px var(--hd);letter-spacing:.2em;margin:0 0 6px}.sheet small{color:var(--mut)}
label{display:block;font-size:12px;color:var(--mut);margin:14px 0 5px}
input,textarea{width:100%;background:#0b0c08;border:1px solid var(--ln);color:var(--fg);padding:12px;font:inherit;font-size:16px;border-radius:0}
textarea{min-height:90px;resize:vertical}
.wa{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding:16px;border:1px solid var(--fg);color:var(--fg);text-decoration:none;font:400 11px var(--hd);letter-spacing:.2em}
.pv{width:100%;max-height:200px;object-fit:cover;margin-top:8px}
.row{display:flex;gap:10px;margin-top:20px}.row .btn{flex:1;padding:12px}.row .go{background:var(--ac);color:#0b0c08}
.warn{background:#2a2410;border:1px solid #6b5a1c;padding:8px 12px;font-size:12px;text-align:center;width:100%}
.split{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--ln);max-width:1100px;margin:0 auto}
.split .tx{padding:clamp(20px,7vw,80px) clamp(16px,6vw,70px);display:flex;flex-direction:column;justify-content:center}
.split h2{font-size:clamp(17px,3.6vw,36px)}.split p{color:var(--fg);font-size:clamp(11px,1.6vw,15px);max-width:320px;margin:10px 0 0}
.split img{width:100%;height:100%;min-height:240px;object-fit:cover}
.sz{display:flex;gap:10px;margin-top:16px}.sz button{flex:1;padding:14px 4px;background:none;border:1px solid var(--ln);font:400 10px var(--hd);letter-spacing:.14em}.sz button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.wa.off{opacity:.3;pointer-events:none}
.hero{position:relative;isolation:isolate;width:100%;max-width:1100px;margin:0 auto;min-height:max(620px,100svh);max-height:980px;display:flex;flex-direction:column;overflow:hidden}
.hero .bg{position:absolute;left:0;bottom:0;width:100%;height:76%;object-fit:cover;object-position:34% 100%;z-index:-1;-webkit-mask-image:linear-gradient(transparent 0,#000 26%);mask-image:linear-gradient(transparent 0,#000 26%)}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:12%;background:linear-gradient(transparent,var(--bg));z-index:0;pointer-events:none}
@media(min-width:760px){.hero{min-height:0;max-height:none;aspect-ratio:1024/1185}.hero .bg{height:100%;-webkit-mask-image:linear-gradient(transparent 0,#000 9%);mask-image:linear-gradient(transparent 0,#000 9%)}}
.hh{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:18px 5vw 0;position:relative;z-index:2}
.hlogo{width:clamp(112px,26vw,240px)}.hm{justify-self:start}.hr{justify-self:end;display:flex;gap:clamp(16px,4vw,32px)}
.ib{background:none;border:0;padding:0;color:var(--fg);display:block}.ib svg{width:clamp(20px,3.4vw,30px);stroke:currentColor;fill:none;stroke-width:1.5;display:block}.hm svg{width:clamp(24px,4vw,36px)}
.tags{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:2.2vh 5vw 0;position:relative;z-index:2}
.tg{font:400 clamp(8px,2.2vw,11px)/1.8 var(--hd);letter-spacing:.26em}.tg i{display:block;width:28px;border-top:1px solid var(--fg);margin-top:8px}
.hcopy{position:relative;z-index:2;text-align:center;padding:3.2vh 5vw 0}
.hl{font:400 clamp(19px,5.4vw,54px)/1.4 var(--hd);letter-spacing:.14em;margin:0;text-shadow:0 2px 18px rgba(0,0,0,.75)}
.hs{margin-top:14px;font:400 clamp(8px,2.2vw,12px)/1.6 var(--hd);letter-spacing:.38em;color:#cfcdb8}
.scr{margin-top:auto;align-self:center;padding:0 0 3vh;position:relative;z-index:2;text-align:center;background:none;border:0;color:var(--fg)}
.scr b{width:34px;height:46px;border:1px solid var(--fg);border-radius:99px;margin:0 auto 9px;display:grid;place-items:center}.scr b svg{width:12px;stroke:currentColor;fill:none;stroke-width:1.5}.scr span{font:400 8px var(--hd);letter-spacing:.32em}
.eyebrow{font:400 clamp(8px,2.2vw,10px) var(--hd);letter-spacing:.28em;color:var(--mut);display:flex;gap:12px;align-items:center;flex-wrap:wrap}.eyebrow::after{content:"";width:40px;border-top:1px solid var(--ln)}
.card h3{overflow-wrap:anywhere;line-height:1.55}
.sec,.split,footer{position:relative;z-index:2}
#fx{position:fixed;inset:0;z-index:1;pointer-events:none}
#alien{position:fixed;left:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:8;display:none;pointer-events:none}
#alien svg{display:block;pointer-events:auto;cursor:pointer;filter:drop-shadow(0 4px 10px rgba(0,0,0,.5))}
.bub{position:absolute;left:34px;bottom:146px;background:var(--fg);color:#0b0c08;font:500 12px/1.35 var(--bd);padding:8px 12px;border-radius:14px 14px 14px 2px;width:max-content;max-width:170px;opacity:0;transform:scale(.6);transform-origin:0 100%;transition:.25s}.bub.on{opacity:1;transform:none}
.legL,.legR,.armR{transform-box:view-box}
.walk .legL{animation:stA .3s ease-in-out infinite alternate}.walk .legR{animation:stB .3s ease-in-out infinite alternate}.wave .armR{animation:wv .45s ease-in-out infinite alternate}.tip{animation:pl 1.2s ease-in-out infinite alternate}
@keyframes stA{from{transform:rotate(-20deg)}to{transform:rotate(20deg)}}@keyframes stB{from{transform:rotate(20deg)}to{transform:rotate(-20deg)}}@keyframes wv{from{transform:rotate(-12deg)}to{transform:rotate(38deg)}}@keyframes pl{from{opacity:.35}to{opacity:1}}
#alien{bottom:0;width:clamp(96px,28vw,150px)}#alien img{display:block;width:100%;pointer-events:auto;cursor:pointer;filter:drop-shadow(0 0 16px rgba(180,160,255,.22))}#alien .bub{left:58%;bottom:88%}
#fxb{position:fixed;inset:0;z-index:0;pointer-events:none}
#alien{bottom:calc(8px + env(safe-area-inset-bottom,0px));width:clamp(84px,24vw,120px)}#alien img{filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}#alien .bub{left:auto;right:38%;bottom:102%;border-radius:14px 14px 2px 14px;transform-origin:100% 100%}
#alien{bottom:calc(0px + env(safe-area-inset-bottom,0px));width:clamp(104px,30vw,130px)}#alien canvas{display:block;width:100%;height:auto;pointer-events:auto;cursor:pointer;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}#alien .bub{right:42%;bottom:88%}
.ig{text-decoration:none;width:max-content;display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;color:var(--fg);padding:6px 10px;margin:0 auto 24px;font:400 9px var(--hd);letter-spacing:.3em;cursor:pointer;position:relative;z-index:3}footer .ig{opacity:1;margin-top:0;color:var(--fg)}.ig svg{width:46px;overflow:visible;animation:igf 3.2s ease-in-out infinite}.ig .fl{transform-box:fill-box;transform-origin:50% 0;animation:igk .16s ease-in-out infinite alternate}
@keyframes igf{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6px) rotate(3deg)}}@keyframes igk{from{transform:scaleY(.75)}to{transform:scaleY(1.3)}}
</style></head>

function shrink(f,max){return new Promise((ok,no)=>{const i=new Image,u=URL.createObjectURL(f);i.onload=()=>{const r=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*r);c.height=Math.round(i.height*r);c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.8))};i.onerror=no;i.src=u})}
function card(p,i){return `<div class="card">${admin?`<div class="adm"><button data-a="edit" data-i="${i}">Editar</button><button data-a="del" data-i="${i}">Borrar</button></div>`:''}<div class="im">${p.img?`<img src="${p.img}" alt="${esc(p.name)}" loading="lazy">`:''}</div><div class="in"><h3>${esc(p.name)}</h3><p>${esc(p.desc)}</p><div class="price">${money(p.price)}</div><div style="font-size:11px;color:var(--mut);letter-spacing:.1em">${(p.sizes||SZ).map(s=>s[0]).join(" · ")}</div><button class="ord" data-a="order" data-i="${i}">ORDENAR</button></div></div>`}

document.addEventListener('click',async e=>{
 const t=e.target.closest('[data-a]');if(!t)return;if(e.target.closest('[data-stop]')&&t.classList.contains('ov'))return;
 const a=t.dataset.a,i=+t.dataset.i;
 if(a==='order'){draft=i;size='';modal='order'}
 else if(a==='size'){size=t.dataset.s}
 else if(a==='menu'){modal='menu'}
 else if(a==='contact'){modal='contact'}
 else if(a==='search'){showSearch=!showSearch;if(!showSearch)q=''}
 else if(a==='goto'){document.getElementById('catalogo').scrollIntoView({behavior:'smooth'});return}
 else if(a==='close'){modal='';draft=null}
 else if(a==='admin'){admin=!admin}
 else if(a==='new'){draft={name:'',desc:'',price:'',img:''};modal='prod'}
 else if(a==='edit'){draft={...S.products[i]};modal='prod'}
 else if(a==='del'){if(confirm('¿Borrar este producto?')){S.products.splice(i,1);dirty=true}}
 else if(a==='set'){modal='set'}
 else if(a==='nohero'){S.hero='';dirty=true;modal=''}
 else if(a==='saveprod'){const d=draft;d.name=v('f-name').trim();d.desc=v('f-desc').trim();d.price=v('f-price');d.sizes=SZ.filter((s,k)=>document.getElementById('sz'+k).checked);if(!d.sizes.length){alert('Elige al menos una talla');return}const f=document.getElementById('f-img').files[0];if(f)d.img=await shrink(f,900);
  if(!d.name){alert('Pon un nombre');return}
  if(d.id){S.products[S.products.findIndex(p=>p.id===d.id)]=d}else{d.id=Date.now().toString(36);S.products.unshift(d)}dirty=true;modal='';draft=null}
 else if(a==='saveset'){S.wa=S.wa.map((w,k)=>({label:v('w-l'+k).trim(),number:v('w-n'+k).trim()}));const f=document.getElementById('f-hero').files[0];if(f)S.hero=await shrink(f,1600);dirty=true;modal=''}
 else if(a==='pub'){t.textContent='Publicando…';await publish();return}
 render()});

P.loop=now=>{if(!P.on)return;requestAnimationFrame(P.loop);const dt=Math.min(.05,(now-P.lt)/1000||.016);P.lt=now;P.tm+=dt;const p=pose(P.tm,dt);if(mesh)mesh.draw(p)};
const hi=['Hola, terrícola 👽','Bienvenido a ORBIA','Same sky, two energies ✨','¡Mira el drop nuevo! 🌙','Pide tu talla por WhatsApp 💬'];
let busy=false;const say=t=>{bub.textContent=t||pick(hi);bub.classList.add('on')};
async function visit(){if(busy||document.hidden||admin||modal)return;busy=true;try{const vw=innerWidth;A.style.display='block';P.start();const w2=A.offsetWidth||120,stop=Math.max(150,R(.4,.7)*vw-w2/2);
 P.walk(-1);await A.animate([{transform:`translateX(${vw+20}px)`},{transform:`translateX(${stop}px)`}],{duration:5200,easing:'linear',fill:'forwards'}).finished;P.walk(0);
 await sleep(350);say();await P.hop();P.wave(1);await sleep(2600);P.wave(0);bub.classList.remove('on');await sleep(500);
 P.walk(1);await A.animate([{transform:`translateX(${stop}px)`},{transform:`translateX(${vw+20}px)`}],{duration:5200,easing:'linear',fill:'forwards'}).finished}catch(e){}
 P.walk(0);P.wave(0);P.stop();A.getAnimations({subtree:true}).forEach(x=>x.cancel());bub.classList.remove('on');A.style.display='none';busy=false}
pc.addEventListener('click',()=>{if(!busy)return;say();P.hop()});
setTimeout(visit,25000);setInterval(visit,180000);

})();

<script>
(function(){
document.addEventListener('click',e=>{const b=e.target.closest('.ig');if(!b||b.dataset.on)return;b.dataset.on=1;
const k=b.animate([{transform:'translate(0,0) rotate(0) scale(1)'},{transform:'translate(-3px,2px) rotate(-6deg) scale(.9)',offset:.15},{transform:'translate(3px,3px) rotate(6deg) scale(.9)',offset:.3},{transform:'translate(0,-8px) rotate(0) scale(1.08)',offset:.45},{transform:'translate(120px,-170px) rotate(38deg) scale(.35)',opacity:0}],{duration:900,easing:'cubic-bezier(.45,0,.85,.35)',fill:'forwards'});
const fs=[...b.querySelectorAll('.fl')].map(f=>f.animate([{transform:'scaleY(1)'},{transform:'scaleY(2.6)'}],{duration:900,fill:'forwards'}));
setTimeout(()=>{k.cancel();fs.forEach(x=>x.cancel());b.animate([{transform:'translate(-60px,50px) scale(.4)',opacity:0},{transform:'none',opacity:1}],{duration:500,easing:'ease-out'});delete b.dataset.on},1600)});
})();
</script>
